<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>线性代数 第3讲 向量组的线性相关性_哔哩哔哩_bilibili</title>
<!--
  开发自测页：不用装扩展，直接在浏览器里跑 extension/content.js。
  - 模拟播放器：<video> 由 canvas 推流；字幕节点 class 含 subtitle，按 currentTime 切换
  - 用一个小 shim 代替 chrome.runtime / chrome.storage，直连本地代理（http://localhost:8787）
  - 截图用 canvas 当前帧代替 captureVisibleTab
  - 「字幕烧进画面」：字幕画进视频帧、DOM 里不再有，用来测本地画面识字
  - v1.2：仿 B 站的字幕菜单（.bpx-player-ctrl-subtitle），可切换「已打开 / 没打开 / 要登录 / 没有字幕 / 没有字幕按钮」
          视频时间是可跳转的虚拟时钟（MediaStream 本身不能 seek），用来测回溯和「倒回 30 秒」
          chrome.storage 的 hist:/past: 存进 localStorage，刷新页面历史还在
  打开方式：在项目根目录起一个静态服务器（例如 python -m http.server 8790），访问 /dev/test-page.html
  地址参数：
    ?proxy=http://localhost:8788  连别的代理（开发代理见 .claude/launch.json 的 proxy-dev）
    ?sub=on|off|login|none|nobutton  初始字幕状态（默认 on）
    ?burn=1        字幕烧进画面
    ?rate=2        虚拟时钟倍速（测「播放 20 秒无字幕主动提醒」时省时间；不要超过 2）
    ?fakemic=1     假麦克风：把 dev/sample-question.wav 当作麦克风输入（测本机语音识别全流程）
    ?mic=deny      模拟麦克风权限被拒
    ?fresh=1       清空本页保存的历史
    ?full=1        v1.3 整片字幕：换成 dev/sample-subtitles.json 那节约 8 分钟的课，并把整份字幕放进页面
                   （<script id="lb-dev-fullsubs">），content.js 当作从 B 站接口拿到的整片字幕 → /memory/build
-->
<style>
  :root { --bg: #f4f5f7; --card: #fff; --ink: #18191c; --ink-2: #61666d; --line: #e3e5e7; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; }
  header { height: 56px; display: flex; align-items: center; padding: 0 24px; background: var(--card); border-bottom: 1px solid var(--line); font-weight: 700; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; max-width: 1280px; margin: 20px auto; padding: 0 24px; }
  h1.video-title { font-size: 20px; margin: 0 0 12px; }
  .bpx-player-container { position: relative; background: #000; border-radius: 8px; overflow: hidden; }
  .bpx-player-video-wrap video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  .bpx-player-subtitle-wrap { position: absolute; left: 0; right: 0; bottom: 56px; text-align: center; pointer-events: none; }
  .bpx-player-subtitle-panel-text { display: inline-block; padding: 2px 10px; background: rgba(0,0,0,.55); color: #fff; font-size: 20px; border-radius: 4px; }
  .bpx-player-subtitle-panel-text:empty { display: none; }
  .bpx-player-control-wrap { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: linear-gradient(transparent, rgba(0,0,0,.7)); color: #fff; }
  .bpx-player-control-wrap button { background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 6px; padding: 4px 12px; cursor: pointer; }
  .bpx-player-ctrl-subtitle { position: relative; margin-left: auto; }
  .bpx-player-ctrl-subtitle-menu { position: absolute; right: 0; bottom: 36px; min-width: 170px; padding: 6px; border-radius: 8px; background: rgba(20,20,20,.92); font-size: 12px; display: none; }
  .bpx-player-ctrl-subtitle.open .bpx-player-ctrl-subtitle-menu { display: block; }
  .bpx-player-ctrl-subtitle-language-item { padding: 4px 8px; border-radius: 5px; cursor: pointer; list-style: none; }
  .bpx-player-ctrl-subtitle-language-item:hover { background: rgba(255,255,255,.12); }
  .bpx-player-ctrl-subtitle-language-item.bpx-state-active { color: #00aeec; }
  .bpx-player-ctrl-subtitle-language-unlogin { padding: 4px 8px; color: #ffb020; }
  .bpx-player-ctrl-subtitle ul { margin: 0; padding: 0; }
  .harness { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
  aside .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; color: var(--ink-2); }
  .help { margin-top: 12px; color: var(--ink-2); font-size: 13px; }
  .help code { background: var(--card); border: 1px solid var(--line); padding: 0 4px; border-radius: 4px; }
</style>
</head>
<body>
<header>开发自测页 · 模拟课程播放页</header>
<main>
  <section>
    <h1 class="video-title" title="线性代数 第3讲 向量组的线性相关性">线性代数 第3讲 向量组的线性相关性</h1>
    <div class="bpx-player-container">
      <div class="bpx-player-video-wrap"><video id="v" muted playsinline></video></div>
      <div class="bpx-player-subtitle-wrap"><span class="bpx-player-subtitle-panel-text" id="sub"></span></div>
      <div class="bpx-player-control-wrap">
        <button id="toggle" type="button">播放</button>
        <span id="clock">00:00</span>
        <div class="bpx-player-ctrl-btn bpx-player-ctrl-subtitle" id="subctrl">
          <button type="button" id="subbtn">字幕</button>
          <div class="bpx-player-ctrl-subtitle-menu">
            <div class="bpx-player-ctrl-subtitle-language-unlogin" style="display:none">登录后才能看 AI 字幕</div>
            <ul id="langs"></ul>
          </div>
        </div>
      </div>
    </div>
    <p class="help">点「播放」，看几秒后暂停 → 画面中央出现「我这里不懂」，或随时按 <code>1</code>。地址参数见源码顶部注释。</p>
    <div class="harness">
      <label>字幕状态
        <select id="substate">
          <option value="on">已打开</option>
          <option value="off">有字幕，没打开</option>
          <option value="login">要登录</option>
          <option value="none">没有字幕</option>
          <option value="nobutton">没有字幕按钮</option>
        </select>
      </label>
      <label><input type="checkbox" id="burn"> 字幕烧进画面</label>
      <button type="button" id="seek0">跳到 00:00</button>
      <button type="button" id="clearHist">清空本页历史</button>
    </div>
  </section>
  <aside>
    <div class="card">推荐视频 1</div>
    <div class="card">推荐视频 2</div>
    <div class="card">推荐视频 3</div>
  </aside>
</main>

<script>
// ---------------------------------------------------------------- 模拟一节课
let LECTURE = [
  [0, '好，我们开始今天的内容'],
  [3, '上节课我们讲了向量的线性组合'],
  [7, '今天来看一个非常核心的概念'],
  [11, '叫做向量组的线性相关性'],
  [15, '我们来看这三个向量 a1 a2 a3'],
  [19, '如果其中任何一个都不能由其余的线性表示'],
  [24, '我们就说这个向量组线性无关'],
  [28, '反过来，只要有一个能被别的表示出来'],
  [32, '这个向量组就是线性相关的'],
  [36, '注意这两个概念是互斥的'],
  [40, '等价的说法是：只有零系数才能组合出零向量'],
  [46, '我们看一个具体的例子'],
  [50, '一零和零一这两个向量'],
  [54, '显然谁也不是谁的倍数，所以线性无关'],
  [60, ''],
];
const video = document.getElementById('v');
const sub = document.getElementById('sub');
const params = new URLSearchParams(location.search);
let DURATION = 64;

// ---------------------------------------------------------------- v1.3 整片字幕（?full=1）
// 同步读 sample-subtitles.json：必须在 content.js 之前放好 #lb-dev-fullsubs，它启动时就会去取整片字幕
if (params.get('full') === '1') {
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', 'sample-subtitles.json', false);
    xhr.send();
    const body = JSON.parse(xhr.responseText).body || [];
    LECTURE = body.map((c) => [c.from, c.content]);
    const end = body.length ? body[body.length - 1].to : 60;
    LECTURE.push([end, '']);
    DURATION = Math.ceil(end) + 3;
    const el = document.createElement('script');
    el.type = 'application/json';
    el.id = 'lb-dev-fullsubs';
    el.textContent = JSON.stringify({ lan: 'ai-zh', desc: '开发自测：合成的线性代数课', duration: DURATION, body });
    document.head.appendChild(el);
  } catch (e) { console.warn('[harness] 读 sample-subtitles.json 失败', e); }
}

// ---------------------------------------------------------------- 可跳转的虚拟时钟（canvas 推流的 <video> 本身不能 seek）
const RATE = Math.min(2, Math.max(0.25, Number(params.get('rate')) || 1));
const clock = { base: 0, startedAt: null };
const vnow = () => (clock.startedAt == null ? clock.base : Math.min(DURATION, clock.base + (performance.now() - clock.startedAt) / 1000 * RATE));
Object.defineProperty(video, 'currentTime', {
  configurable: true,
  get: vnow,
  set: (t) => {
    clock.base = Math.max(0, Math.min(DURATION, Number(t) || 0));
    if (clock.startedAt != null) clock.startedAt = performance.now();
    video.dispatchEvent(new Event('seeking'));
    setTimeout(() => video.dispatchEvent(new Event('seeked')), 30);
  },
});
Object.defineProperty(video, 'duration', { configurable: true, get: () => DURATION });
video.addEventListener('play', () => { if (clock.startedAt == null) clock.startedAt = performance.now(); });
video.addEventListener('pause', () => { clock.base = vnow(); clock.startedAt = null; });

// ---------------------------------------------------------------- 仿 B 站字幕菜单
const subctrl = document.getElementById('subctrl');
const langs = document.getElementById('langs');
const unlogin = subctrl.querySelector('.bpx-player-ctrl-subtitle-language-unlogin');
const subSel = document.getElementById('substate');
const subParent = subctrl.parentNode;
let subState = params.get('sub') || 'on';
function renderSubCtrl() {
  subSel.value = subState;
  if (subState === 'nobutton') { subctrl.remove(); return; }
  if (!subctrl.isConnected) subParent.appendChild(subctrl);
  unlogin.style.display = subState === 'login' ? '' : 'none';
  langs.textContent = '';
  if (subState === 'none' || subState === 'login') return;
  for (const [lan, name] of [['ai-zh', '中文（自动生成）'], ['close', '关闭']]) {
    const li = document.createElement('li');
    li.className = 'bpx-player-ctrl-subtitle-language-item' + ((subState === 'on' && lan === 'ai-zh') || (subState === 'off' && lan === 'close') ? ' bpx-state-active' : '');
    li.dataset.lan = lan;
    li.textContent = name;
    li.addEventListener('click', () => { subState = lan === 'close' ? 'off' : 'on'; renderSubCtrl(); subctrl.classList.remove('open'); });
    langs.appendChild(li);
  }
}
renderSubCtrl();
subSel.addEventListener('change', () => { subState = subSel.value; renderSubCtrl(); });
document.getElementById('subbtn').addEventListener('click', () => subctrl.classList.toggle('open'));
document.getElementById('seek0').addEventListener('click', () => { video.currentTime = 0; });
const canvas = document.createElement('canvas');
canvas.width = 960; canvas.height = 540;
const g = canvas.getContext('2d');
const burn = document.getElementById('burn');
if (params.get('burn') === '1') burn.checked = true;
const lineAt = (t) => { let line = ''; for (const [at, text] of LECTURE) if (t >= at) line = text; return line; };
const fmt = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function draw() {
  const t = video.currentTime || 0;
  g.fillStyle = '#1d2b28'; g.fillRect(0, 0, 960, 540);
  g.fillStyle = '#e8f1ee'; g.font = 'bold 40px "Microsoft YaHei", sans-serif';
  g.fillText('§3 向量组的线性相关性', 60, 100);
  g.font = '30px "Microsoft YaHei", sans-serif';
  g.fillText('定义：k1·a1 + k2·a2 + k3·a3 = 0', 60, 200);
  g.fillText('仅当 k1 = k2 = k3 = 0 时成立 ⇒ 线性无关', 60, 260);
  g.fillStyle = '#7fd1bf'; g.fillText('例：(1,0) 与 (0,1)', 60, 340);
  g.fillStyle = '#9fb3ad'; g.font = '22px monospace'; g.fillText('t = ' + fmt(t), 820, 510);
  if (burn.checked) {
    const line = lineAt(t);
    if (line) {
      g.font = 'bold 30px "Microsoft YaHei", sans-serif';
      const w = g.measureText(line).width;
      g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(480 - w / 2 - 14, 452, w + 28, 46);
      g.fillStyle = '#ffffff'; g.textAlign = 'center'; g.fillText(line, 480, 486); g.textAlign = 'start';
    }
  }
  requestAnimationFrame(draw);
}
draw();
video.srcObject = canvas.captureStream(30);

function updateSub() {
  const t = video.currentTime || 0;
  document.getElementById('clock').textContent = fmt(t);
  if (subState !== 'on' || burn.checked) { sub.textContent = ''; return; }
  const line = lineAt(t);
  if (sub.textContent !== line) sub.textContent = line;
}
setInterval(updateSub, 200);
const toggle = document.getElementById('toggle');
toggle.addEventListener('click', () => (video.paused ? video.play() : video.pause()));
video.addEventListener('play', () => (toggle.textContent = '暂停'));
video.addEventListener('pause', () => (toggle.textContent = '播放'));

// ---------------------------------------------------------------- chrome.* shim
(() => {
  const PROXY = (new URLSearchParams(location.search).get('proxy') || 'http://localhost:8787').replace(/\/+$/, '');
  const PERSIST_KEY = 'lb_harness_store';
  const persisted = /^(hist:|past:|pendingRestore$|subGuide$|voiceEngine$|summaryAi$)/;
  if (params.get('fresh') === '1') { try { localStorage.removeItem(PERSIST_KEY); } catch (_) {} }
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(PERSIST_KEY) || '{}'); } catch (_) {}
  const store = { proxyUrl: PROXY, sendImage: true, hardsub: true, voice: true, mode: 'direct', ...saved };
  const persist = () => {
    const out = {};
    for (const [k, v] of Object.entries(store)) if (persisted.test(k)) out[k] = v;
    try { localStorage.setItem(PERSIST_KEY, JSON.stringify(out)); } catch (_) {}
  };
  const clone = (v) => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));
  const changeListeners = [];
  const later = (fn) => setTimeout(fn, 0);
  const notify = (changes) => later(() => changeListeners.forEach((f) => f(changes, 'local')));
  async function handle(msg) {
    if (msg.type === 'hist:list') {
      if (store.summaryAi !== false) later(() => LBHistory.backfill(msg.videoId, (path, body) => handle({ type: 'call', path, body })));
      return { ok: true, data: await LBHistory.list(msg.videoId) };
    }
    if (msg.type === 'hist:put') {
      const entry = await LBHistory.put(msg.node);
      if (msg.summarize && store.summaryAi !== false) LBHistory.summarize(msg.node.videoId, msg.node.id, (path, body) => handle({ type: 'call', path, body }), msg.sessionId);
      return { ok: true, data: entry };
    }
    if (msg.type === 'capture') {
      return { ok: true, dataUrl: canvas.toDataURL('image/jpeg', 0.7) };
    }
    if (msg.type === 'call') {
      try {
        const res = await fetch(PROXY + msg.path, msg.body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(msg.body) });
        const data = await res.json().catch(() => null);
        return res.ok ? { ok: true, data } : { ok: false, status: res.status, error: (data && data.error) || 'HTTP ' + res.status };
      } catch (e) { return { ok: false, unreachable: true, error: String(e) }; }
    }
    return { ok: false, error: 'unknown' };
  }
  function makePort() {
    const onMsg = [];
    const ctrl = new AbortController();
    const emit = (ev) => later(() => onMsg.forEach((f) => f(ev)));
    return {
      onMessage: { addListener: (f) => onMsg.push(f) },
      onDisconnect: { addListener: () => {} },
      disconnect: () => ctrl.abort(),
      postMessage: async (msg) => {
        let res;
        try {
          res = await fetch(PROXY + msg.path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(msg.body), signal: ctrl.signal });
        } catch (e) { emit({ type: 'error', unreachable: true, message: String(e) }); emit({ type: 'end' }); return; }
        if (!res.ok) { const d = await res.json().catch(() => ({})); emit({ type: 'error', message: d.error || 'HTTP ' + res.status }); emit({ type: 'end' }); return; }
        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        try {
          for (;;) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            let i;
            while ((i = buf.indexOf('\n\n')) >= 0) {
              const line = buf.slice(0, i); buf = buf.slice(i + 2);
              if (line.startsWith('data:')) emit(JSON.parse(line.slice(5)));
            }
          }
        } catch (_) { /* aborted */ }
        emit({ type: 'end' });
      },
    };
  }
  window.chrome = window.chrome || {};
  const runtime = {
    lastError: undefined,
    sendMessage: (msg, cb) => { handle(msg).then((r) => cb && later(() => cb(r))); },
    connect: () => makePort(),
  };
  const reply = (cb, value) => { if (cb) { later(() => cb(value)); return undefined; } return Promise.resolve(value); };
  const storage = {
    local: {
      get: (keys, cb) => {
        const out = {};
        if (keys == null) Object.assign(out, clone(store));
        else if (typeof keys === 'string') { if (keys in store) out[keys] = clone(store[keys]); }
        else if (Array.isArray(keys)) { for (const k of keys) if (k in store) out[k] = clone(store[k]); }
        else for (const [k, v] of Object.entries(keys)) out[k] = k in store ? clone(store[k]) : v;
        return reply(cb, out);
      },
      set: (obj, cb) => {
        const changes = {};
        for (const [k, v] of Object.entries(obj)) { changes[k] = { oldValue: store[k], newValue: clone(v) }; store[k] = clone(v); }
        persist();
        notify(changes);
        return reply(cb);
      },
      remove: (keys, cb) => {
        const changes = {};
        for (const k of [].concat(keys)) if (k in store) { changes[k] = { oldValue: store[k] }; delete store[k]; }
        persist();
        if (Object.keys(changes).length) notify(changes);
        return reply(cb);
      },
      getBytesInUse: (keys, cb) => reply(cb, JSON.stringify(store).length),
    },
    onChanged: { addListener: (f) => changeListeners.push(f) },
  };
  try { Object.defineProperty(window.chrome, 'runtime', { value: runtime, configurable: true }); } catch (_) { window.chrome.runtime = runtime; }
  try { Object.defineProperty(window.chrome, 'storage', { value: storage, configurable: true }); } catch (_) { window.chrome.storage = storage; }
  window.__harnessStore = store;
  document.getElementById('clearHist').addEventListener('click', () => {
    storage.local.remove(Object.keys(store).filter((k) => /^(hist:|past:)/.test(k)));
  });

  // ---------------- 假麦克风（?fakemic=1）/ 权限被拒（?mic=deny）
  if (navigator.mediaDevices && (params.get('fakemic') === '1' || params.get('mic') === 'deny')) {
    navigator.mediaDevices.getUserMedia = async () => {
      if (params.get('mic') === 'deny') throw new DOMException('Permission denied', 'NotAllowedError');
      const ac = new AudioContext();
      const buf = await ac.decodeAudioData(await (await fetch('sample-question.wav')).arrayBuffer());
      const src = ac.createBufferSource();
      src.buffer = buf;
      const dest = ac.createMediaStreamDestination();
      src.connect(dest);
      src.start();
      window.__fakeMic = { duration: buf.duration, startedAt: performance.now() };
      const stream = dest.stream;
      for (const t of stream.getAudioTracks()) {
        const stop = t.stop.bind(t);
        t.stop = () => { stop(); try { src.stop(); } catch (_) {} ac.close(); };
      }
      return stream;
    };
  }
})();
</script>
<script src="../extension/history.js"></script>
<script src="../extension/content.js"></script>
</body>
</html>
